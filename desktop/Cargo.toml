[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# dirs provides a cross-platform home directory lookup (used for the default
# directory when the UI calls list_directory without a path).
dirs = "5"
# open launches a file/folder with the operating system's default application.
open = "5"
# libc provides statfs/statvfs for the disk_usage command (real volume free/
# total space). It is ALREADY in the dependency tree transitively, so adding
# it introduces no new crates — and it replaces fabricated storage numbers.
libc = "0.2"
